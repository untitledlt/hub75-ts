name: Publish to GitHub Packages

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"
          scope: "@${{ github.repository_owner }}"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build project
        run: yarn build

      - name: Configure package.json for GitHub Packages
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          if (!pkg.name.startsWith('@')) {
            pkg.name = '@${{ github.repository }}';
          }
          pkg.publishConfig = {
            registry: 'https://npm.pkg.github.com'
          };
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Configure Yarn authentication
        run: |
          yarn config set npmScopes.untitledlt.npmRegistryServer "https://npm.pkg.github.com"
          yarn config set npmScopes.untitledlt.npmAlwaysAuth true
          yarn config set npmScopes.untitledlt.npmAuthToken "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish to GitHub Packages
        run: yarn npm publish --access public
